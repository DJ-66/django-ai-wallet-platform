{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🌐</div>

    <h1>{% trans "Continue with Google" %}</h1>
    <p class="auth-subtitle">
        {% trans "You are about to sign in using your Google account." %}

    </p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="google-login-btn google-submit-btn">
        <span class="google-icon">G</span>
          {% trans "Continue with Google" %}
      </button>
    </form>

    <p class="auth-footer-text">
      <a href="{% url 'account_login' %}">    {% trans "Back to login" %}
</a>
    </p>
  </div>
</div>
{% endblock %}
