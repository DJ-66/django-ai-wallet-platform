{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">📬</div>

        <h2>{% trans "Check Your Email" %}</h2>


        <p class="auth-subtitle">
                {% trans "If an account exists for that email, we sent a password reset link." %}

        </p>

        <a href="{% url 'account_login' %}" class="auth-primary-btn auth-link-btn">
                {% trans "Back to Sign In" %}

        </a>
    </div>
</div>
{% endblock %}
