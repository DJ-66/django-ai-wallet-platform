{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">🔐</div>

        <h2>{% trans "Reset Password" %}</h2>
        <p class="auth-subtitle">
                {% trans "Enter your email and we’ll send you a reset link." %}
        </p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="auth-primary-btn">
                    {% trans "Send Reset Link" %}
            </button>
        </form>

        <p class="auth-bottom-text">
                {% trans "Remember your password?" %}
           <a href="{% url 'account_login' %}">{% trans "Sign in" %}
</a>
        </p>
    </div>
</div>
{% endblock %}
