<article class="growth-asset">

    <div class="growth-asset-preview">

        <div class="growth-asset-brand">
            FANZ
        </div>

        <p class="growth-asset-kicker">
            We Gift You
        </p>

        <h2 class="growth-asset-credit">
            50 FREE CREDITS
        </h2>

        <p class="growth-asset-copy">
            Join FANZ through {{ business.name }}
        </p>

        <div class="growth-asset-qr">
            <img
                src="{{ referral_qr_url }}"
                alt="Join FANZ through {{ business.name }}">
        </div>

        <h3 class="growth-asset-business">
            {{ business.name }}
        </h3>

        <p class="growth-asset-footer">
            Join FANZ • Get 50 Credits
        </p>

        <p class="growth-asset-domain">
            fanz.to
        </p>

    </div>

    <div class="growth-asset-details">

        <h2>Your Referral Card</h2>

        <p>
            Share this card with customers to invite them to FANZ
            and help grow your community.
        </p>

        <div class="growth-asset-link">
            <input
                type="text"
                value="{{ referral_url }}"
                readonly
                aria-label="Business referral link">
        </div>

        <div class="growth-asset-actions">
            <button type="button" disabled>
                WhatsApp
            </button>

            <button type="button" disabled>
                Telegram
            </button>

            <button type="button" disabled>
                Download
            </button>

            <button type="button" disabled>
                Print
            </button>
        </div>

        <p class="growth-asset-note">
            Sharing and download tools are coming next.
        </p>

    </div>

</article>
