<article class="growth-asset">

    <div class="growth-asset-preview">

    <p class="campaign-ready-title">
        📣 READY TO SHARE
    </p>

    <p class="campaign-gift-title">
        WE GIFT YOU
    </p>

    <h2 class="growth-asset-credit">
        50 FREE CREDITS
    </h2>

        <div class="growth-asset-qr">
            <img
                src="{{ referral_qr_url }}"
                alt="Join FANZ through {{ business.name }}">
        </div>

        <h3 class="growth-asset-business">
            {{ business.name }}
        </h3>

        <h2 class="growth-asset-footer">
            Join FANZ • Get 50 Credits
        </h2>

        <p class="growth-asset-domain">
            Fanz.to
        </p>

     </div>

    <div class="growth-asset-details">

        <h2>Referral Campaign</h2>

        <p>
            Share this card with customers and invite them into your FANZ community.
        </p>

        <div class="growth-asset-link">
            <input
                type="text"
                value="{{ referral_url }}"
                readonly
                aria-label="Business referral link">
        </div>

        <div class="growth-asset-actions">

    <button
        type="button"
        class="growth-asset-action growth-asset-action--copy"
        data-copy-referral-link="{{ referral_url }}">
        Copy Link
    </button>

    <a
    class="growth-asset-action growth-asset-action--whatsapp"
    href="{{ whatsapp_share_url }}"
    target="_blank"
    rel="noopener">
    WhatsApp
    </a>

    <button type="button" disabled>
        Download
    </button>
    <button
    type="button"
    class="growth-asset-action growth-asset-action--print"
    data-print-growth-asset>
    Print
</button>

</div>

        <p class="growth-asset-note">
            Sharing and download tools are coming next.
        </p>

    </div>

</article>
