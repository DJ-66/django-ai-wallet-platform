<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;padding:30px 12px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,0.08);">

          <tr>
            <td style="background:linear-gradient(135deg,#111827,#2563eb);padding:34px 28px;text-align:center;color:#ffffff;">
              <div style="font-size:42px;line-height:1;">{% block email_icon %}🎉{% endblock %}</div>
              <h1 style="margin:14px 0 0;font-size:28px;line-height:1.2;">{% block email_title %}FANZ{% endblock %}</h1>
              <p style="margin:10px 0 0;font-size:15px;color:#dbeafe;">
                {% block email_subtitle %}{% endblock %}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:32px 28px;">
              {% block email_body %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="border-top:1px solid #e5e7eb;padding:20px 28px;text-align:center;">
              <p style="margin:0 0 6px;font-size:13px;color:#6b7280;font-weight:700;">
                IA Para Todos — AI for Everyone
              </p>
              <p style="margin:0 0 10px;font-size:12px;color:#9ca3af;">
                Helping creators, businesses, and communities grow with AI.
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;">
                © {% now "Y" %} Fanz.to
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
