<div
  id="fanz-lightbox"
  class="fanz-lightbox"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-label="Image viewer"
>
  <button
    type="button"
    class="fanz-lightbox__backdrop"
    data-fanz-lightbox-close
    aria-label="Close image viewer"
  ></button>

  <div class="fanz-lightbox__content">
    <button
      type="button"
      class="fanz-lightbox__close"
      data-fanz-lightbox-close
      aria-label="Close image viewer"
    >
      ×
    </button>
      <button
    type="button"
    class="fanz-lightbox__nav fanz-lightbox__nav--prev"
    data-fanz-lightbox-prev
    aria-label="Previous image"
>
    &#10094;
</button>
    <img
      src=""
      alt=""
      class="fanz-lightbox__image"
      data-fanz-lightbox-image
    >
            <div
      class="fanz-lightbox__counter"
      data-fanz-lightbox-counter
      aria-live="polite"
      hidden
    ></div>
      <button
    type="button"
    class="fanz-lightbox__nav fanz-lightbox__nav--next"
    data-fanz-lightbox-next
    aria-label="Next image"
>
    &#10095;
</button>
    <p
      class="fanz-lightbox__caption"
      data-fanz-lightbox-caption
      hidden
    ></p>
  </div>
</div>
