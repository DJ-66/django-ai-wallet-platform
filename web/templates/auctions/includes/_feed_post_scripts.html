{% load i18n %}

<script>
function getCookie(name) {
    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();

            if (
                cookie.substring(0, name.length + 1) ===
                name + "="
            ) {
                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;
            }
        }
    }

    return cookieValue;
}

document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".ajax-like-btn").forEach(function (button) {
        button.addEventListener("click", function () {
            const url = button.dataset.url;
            const postId = button.dataset.postId;

            fetch(url, {
                method: "GET",
                headers: {
                    "X-Requested-With": "XMLHttpRequest",
                },
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    const countSpan = document.getElementById(
                        `like-count-${postId}`
                    );

                    if (countSpan) {
                        countSpan.textContent = data.like_count;
                    }
                })
                .catch(function (error) {
                    console.error("Like error:", error);
                });
        });
    });

    document.querySelectorAll(".ajax-tip-btn").forEach(function (button) {
        button.addEventListener("click", function () {
            const url = button.dataset.url;
            const amount = button.dataset.amount;
            const originalText = button.innerHTML;

            fetch(url, {
                method: "POST",
                body: JSON.stringify({
                    amount: amount,
                }),
                headers: {
                    "X-Requested-With": "XMLHttpRequest",
                    "X-CSRFToken": getCookie("csrftoken"),
                    "Content-Type": "application/json",
                },
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (!data.success) {
                        alert(
                            data.error ||
                            "{% trans 'Tip failed.' %}"
                        );

                        return;
                    }

                    button.innerHTML = "✅ {% trans 'Tipped' %}";

                    setTimeout(function () {
                        button.innerHTML = originalText;
                    }, 1500);
                })
                .catch(function (error) {
                    console.error("Tip error:", error);
                });
        });
    });

    document.querySelectorAll(".post-comment-form").forEach(function (form) {
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const input = form.querySelector(
                'input[name="content"]'
            );

            if (!input) {
                return;
            }

            const content = input.value.trim();

            if (!content) {
                return;
            }

            fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                headers: {
                    "X-Requested-With": "XMLHttpRequest",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (!data.success) {
                        alert(
                            data.error ||
                            "{% trans 'Comment failed.' %}"
                        );

                        return;
                    }

                    const commentHtml = `
                        <div class="${
                            data.parent_id
                                ? "post-reply"
                                : "post-comment"
                        }">
                            <strong>@${data.username}</strong>
                            <p>${data.content}</p>
                        </div>
                    `;

                    form.insertAdjacentHTML(
                        "beforebegin",
                        commentHtml
                    );

                    input.value = "";
                })
                .catch(function (error) {
                    console.error("Comment error:", error);
                });
        });
    });

    document.querySelectorAll(".share-post-btn").forEach(function (button) {
        button.addEventListener("click", function () {
            const url = button.dataset.url;
            const originalText = button.innerHTML;

            navigator.clipboard
                .writeText(url)
                .then(function () {
                    button.innerHTML =
                        "✅ {% trans 'Copied' %}";

                    setTimeout(function () {
                        button.innerHTML = originalText;
                    }, 1500);
                })
                .catch(function (error) {
                    console.error("Share error:", error);
                });
        });
    });
});
</script>
